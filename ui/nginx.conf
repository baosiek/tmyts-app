server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config and the SPA shell must always be re-fetched so a new
    # container (new API URLs, new deploy) is picked up without a stale
    # browser cache masking it. Hashed JS/CSS chunks are safe to cache
    # forever since their filename changes whenever their content does.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
