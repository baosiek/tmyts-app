<mat-card class="full-size-card" appearance="outlined">
    <mat-card-header style="margin-bottom: 20px;">
        <mat-card-title-group>
            <mat-card-title>{{asset().asset}}</mat-card-title>
            <!-- <mat-card-subtitle>Daily</mat-card-subtitle> -->
        </mat-card-title-group>
    </mat-card-header>
    <mat-card-content>
        <highcharts-chart id="container-live-tracker-{{asset().asset}}"
            [options]="chartOptions()"
            [constructorType]="chartConstructor"
            class="chart-container">
        </highcharts-chart>
        
  </mat-card-content>
</mat-card>
