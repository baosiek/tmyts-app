<div class="table-container">
  <h2>Assets Price Update</h2>
  @if (spinnerFlagIsSet) {
    <div class="spinner-container">
      <mat-spinner class="spinner-container"></mat-spinner>
    </div>
  } @else {
      <table mat-table [dataSource]="dataSource" class="holdings-table" matSort>

    <!-- Asset ticker -->
    <ng-container matColumnDef="asset">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Asset </th>
      <td mat-cell *matCellDef="let element"> {{element.asset}} </td>
    </ng-container>

    <!-- Asset name -->
    <ng-container matColumnDef="asset_name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Asset Name </th>
      <td mat-cell *matCellDef="let element"> {{element.asset_name}} </td>
    </ng-container>

    <!-- Venue -->
    <ng-container matColumnDef="venue">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Venue </th>
      <td mat-cell *matCellDef="let element"> {{element.venue}} </td>
    </ng-container>

    <!-- Priority -->
    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef> Priority </th>
      <td mat-cell *matCellDef="let element"> {{element.priority | number:'1.0-0'}} </td>
    </ng-container>

    <!-- Last download -->
    <ng-container matColumnDef="last_download">
      <th mat-header-cell *matHeaderCellDef> Last Download </th>
      <td mat-cell *matCellDef="let element">
        <app-tmyts-chip
          [iconName]="isUpToDate(element.last_download) ? 'check_circle' : 'error'"
          [classType]="isUpToDate(element.last_download) ? 'success-container' : 'error-container'"
        >{{element.last_download ? (element.last_download | date:'yyyy-MM-dd') : '—'}}</app-tmyts-chip>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  }
  <mat-paginator [pageSizeOptions]="[10, 15, 20]"
                 showFirstLastButtons
                 aria-label="Select page of periodic elements">
  </mat-paginator>

</div>
