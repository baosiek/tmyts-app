<div class="index-card-container">
  @if (index().variation >= 0) {
    <div class="icon-container arrow-up">
      <mat-icon fontSet="material-symbols-outlined">arrow_upward</mat-icon>
    </div>
  } @else {
    <div class="icon-container arrow-down">
      <mat-icon fontSet="material-symbols-outlined">arrow_downward</mat-icon>
    </div>
  }

  <div class="name-container">
    <span class="index-label">{{ index().name | slice:0:9 }}</span>
    <span class="index-points">{{ index().points | number : '1.2-2' }}</span>
  </div>

  <div class="variation-container" [class.variation-up]="index().variation >= 0" [class.variation-down]="index().variation < 0">
    <span class="variation-percent">{{ index().percent | percent: '1.2-2' }}</span>
    <span class="variation-value">{{ index().variation | number : '1.2-2' }}</span>
  </div>
</div>
